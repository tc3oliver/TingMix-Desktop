[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.85"

# Dependencies (flate2/serde_json for the 114 MB LM, DSP) are unusably slow unoptimised; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
