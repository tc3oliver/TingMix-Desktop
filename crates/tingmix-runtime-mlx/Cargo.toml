[package]
name = "tingmix-runtime-mlx"
publish = false
description = "EXPERIMENTAL: TingMix-Large audio tower + reader on MLX C++ behind a narrow C ABI (Apple silicon only)"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
# compatibility probe target (child-process isolated) for tingmix-models
probe = ["dep:tingmix-models"]

[[bin]]
name = "tingmix-mlx-worker"
path = "src/bin/worker.rs"

[dependencies]
tingmix-models = { path = "../tingmix-models", optional = true }
thiserror = "2.0.21"
tingmix-core = { path = "../tingmix-core" }
tingmix-decoder = { path = "../tingmix-decoder" }
tingmix-frontend-gemma = { path = "../tingmix-frontend-gemma" }

[dev-dependencies]
tingmix-streaming = { path = "../tingmix-streaming" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
libc = "0.2.178"

[build-dependencies]
cc = "1.2.40"
