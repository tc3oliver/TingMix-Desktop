[package]
name = "tingmix-models"
publish = false
description = "Signed model manifests, verified download/import, atomic activation, rollback and runtime selection"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
ureq = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
