[package]
name = "tingmix-runtime-onnx"
description = "TingMix-Small on ONNX Runtime (CPU): Rust log-mel frontend and native streaming backend"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
# Dev default: ort downloads its prebuilt ONNX Runtime (pyke build) at build time. Needs network once.
default = ["download-binaries"]
download-binaries = ["ort/download-binaries", "ort/tls-native"]
# Release: no download at build time; the pinned, sha256-verified Microsoft build (tools/ort-fetch) is loaded
# from an explicit path at run time. Build with `--no-default-features --features load-dynamic`.
load-dynamic = ["ort/load-dynamic"]

[dependencies]
tingmix-core = { path = "../tingmix-core" }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray"] }
rustfft = "6.4.1"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tingmix-streaming = { path = "../tingmix-streaming" }
hound = "3.5.1"
libc = "0.2"
