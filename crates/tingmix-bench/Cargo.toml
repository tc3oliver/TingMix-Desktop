[package]
name = "tingmix-bench"
publish = false
description = "Real-time streaming latency, backlog and RSS benchmark / soak harness for AsrBackends"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
tingmix-core = { path = "../tingmix-core" }
tingmix-streaming = { path = "../tingmix-streaming" }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tingmix-runtime-onnx = { path = "../tingmix-runtime-onnx", optional = true }
tingmix-runtime-mlx = { path = "../tingmix-runtime-mlx", optional = true }
tingmix-decoder = { path = "../tingmix-decoder", optional = true }

[features]
# Real backends. Off by default so the harness builds without ONNX Runtime / MLX.
onnx = ["dep:tingmix-runtime-onnx"]
mlx = ["dep:tingmix-runtime-mlx", "dep:tingmix-decoder"]
