    "soundfile==0.14.0",
    "scipy==1.18.1",
    "mlx-whisper==0.4.3",
    "opencc-python-reimplemented==0.1.7",
    "demucs==4.0.1",
    "embed2asr @ git+https://github.com/tc3oliver/embed2asr.git@8c6463b150392ecc0a8b121bba4ab71ed137eb75",
    "tingmix @ git+https://github.com/tc3oliver/tingmix.git@34458e04cc2788ad25e86331535b48a45aed812c",
