[package]
name = "tingmix-app"
description = "TingMix desktop host: typed commands and events over the Rust pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tingmix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[features]
# Slot for TingMix-Large on MLX (Apple silicon, EXPERIMENTAL). Off by default: builds the C++ MLX port.
mlx = ["dep:tingmix-runtime-mlx", "tingmix-runtime-mlx/probe"]

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tingmix-core = { path = "../crates/tingmix-core" }
tingmix-audio = { path = "../crates/tingmix-audio" }
tingmix-streaming = { path = "../crates/tingmix-streaming" }
tingmix-models = { path = "../crates/tingmix-models" }
tingmix-decoder = { path = "../crates/tingmix-decoder" }
# ONNX Runtime is loaded at run time from the bundled library (docs/release/onnxruntime.md): nothing is fetched at build time
tingmix-runtime-onnx = { path = "../crates/tingmix-runtime-onnx", default-features = false, features = ["load-dynamic"] }
tingmix-runtime-mlx = { path = "../crates/tingmix-runtime-mlx", optional = true }
tauri-plugin-updater = "=2.14.0"

[dev-dependencies]
hound = "3.5.1"
