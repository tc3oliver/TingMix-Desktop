name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The real model, the 114 MB LM and the oracle dumps are not in git: TINGMIX_LM_PATH, TINGMIX_ORACLE_DIR,
  # TINGMIX_MLX_ARTIFACT, TINGMIX_LARGE_DIR and MLX_PREFIX are deliberately unset here, so those tests print "skipped"
  # and the MLX crate builds its stub. They are run by hand on the Mac Studio (see docs/release).

jobs:
  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend placeholder for tauri-build
        shell: bash
        run: mkdir -p dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # tingmix-runtime-onnx tests need tools/small-export/out/tiny.onnx (random-weight fixture network, gitignored)
      - uses: astral-sh/setup-uv@v6
      - name: Build the ONNX test fixtures
        shell: bash
        working-directory: tools/small-export
        run: |
          uv sync --locked
          uv run python make_fixtures.py
      - run: cargo test --workspace
      - name: Heavy tests are skipped without their inputs
        shell: bash
        run: |
          for v in MLX_PREFIX TINGMIX_LM_PATH TINGMIX_ORACLE_DIR TINGMIX_MLX_ARTIFACT TINGMIX_LARGE_DIR; do
            if [ -n "${!v:-}" ]; then echo "::error::$v must be unset in CI"; exit 1; fi
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  licenses-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: docs/release/dependency-licenses.md is current
        run: python3 tools/licenses/inventory.py --check

  # The frontend jobs no-op until the app has a package.json.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: fe
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.fe.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.fe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.fe.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.fe.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.fe.outputs.present == 'true'
        run: pnpm vitest run
      - if: steps.fe.outputs.present == 'false'
        run: echo "no package.json yet; frontend checks skipped"

  tauri-build:
    name: tauri build (${{ matrix.name }}, unsigned dev artifact)
    needs: [rust, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: fe
        shell: bash
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.fe.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.fe.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.fe.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.fe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.fe.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # No signing identity or updater key is present: the bundle is a development artifact, not a release.
      - if: steps.fe.outputs.present == 'true'
        run: pnpm tauri build --debug
      - if: steps.fe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tingmix-dev-${{ matrix.name }}
          path: target/debug/bundle/**
          retention-days: 7
          if-no-files-found: error
      - if: steps.fe.outputs.present == 'false'
        shell: bash
        run: echo "no package.json yet; tauri build skipped"

  # Release-mode bundles with the pinned, sha256-verified Microsoft ONNX Runtime (docs/release/onnxruntime.md).
  # Only on tags and manual runs. Nothing here signs or notarizes: the artifacts are unsigned (docs/release/signing-checklist.md).
  package:
    name: package (${{ matrix.name }}, unsigned)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [rust, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, platform: macos-arm64, script: "bundle:macos" }
          - { name: windows-x64, os: windows-latest, platform: windows-x64, script: "bundle:windows" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch ONNX Runtime (sha256-verified)
        shell: bash
        run: |
          # fetch.sh extracts the Windows zip with unzip; fall back to 7z if the runner has none
          if ! command -v unzip >/dev/null 2>&1; then
            unzip() { 7z x -y "$2" -o"$4" >/dev/null; }
            export -f unzip
          fi
          tools/ort-fetch/fetch.sh ${{ matrix.platform }}
      - run: pnpm ${{ matrix.script }}
      - name: Check the macOS bundle links only system libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=target/release/bundle/macos/TingMix.app
          find "$app" -type f \( -perm -u+x -o -name '*.dylib' \) | while read -r f; do
            file "$f" | grep -q Mach-O || continue
            if otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(/System/|/usr/lib/|@rpath/|@loader_path/|@executable_path/)'; then
              echo "::error::unexpected library path in $f"; exit 1
            fi
          done
          du -sk "$app"
          ls -l target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tingmix-${{ matrix.name }}-UNSIGNED
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
